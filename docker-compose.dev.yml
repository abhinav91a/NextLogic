
services:

  # ============================
  # INFRASTRUCTURE
  # ============================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - nextlogic

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - nextlogic

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    networks:
      - nextlogic

  postgres_company:
    image: postgres:15
    environment:
      POSTGRES_DB: companydb
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company123
    ports:
      - "5433:5432"
    networks:
      - nextlogic

  postgres_job:
    image: postgres:15
    environment:
      POSTGRES_DB: jobdb
      POSTGRES_USER: job
      POSTGRES_PASSWORD: job123
    ports:
      - "5434:5432"
    networks:
      - nextlogic

  postgres_user:
    image: postgres:15
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user123
    ports:
      - "5435:5432"
    networks:
      - nextlogic

  postgres_alert:
    image: postgres:15
    environment:
      POSTGRES_DB: alertdb
      POSTGRES_USER: alert
      POSTGRES_PASSWORD: alert123
    ports:
      - "5436:5432"
    networks:
      - nextlogic

  postgres_scraper:
    image: postgres:15
    environment:
      POSTGRES_DB: scraperdb
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper123
    ports:
      - "5437:5432"
    networks:
      - nextlogic

  # ============================
  # DISCOVERY SERVER
  # ============================

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - nextlogic
    environment:
      SPRING_PROFILES_ACTIVE: docker

  # ============================
  # API GATEWAY
  # ============================

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    networks:
      - nextlogic
    environment:
      SPRING_PROFILES_ACTIVE: docker

  # ============================
  # MICROSERVICES
  # ============================

  company-service:
    build:
      context: .
      dockerfile: company-service/Dockerfile
    depends_on:
      - postgres_company
      - kafka
      - eureka-server
    ports:
      - "8081:8081"
    networks:
      - nextlogic
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_company:5432/companydb
      SPRING_DATASOURCE_USERNAME: company
      SPRING_DATASOURCE_PASSWORD: company123
      SPRING_PROFILES_ACTIVE: docker

  job-service:
    build:
      context: .
      dockerfile: job-service/Dockerfile
    depends_on:
      - postgres_job
      - kafka
      - mongo
      - eureka-server
    ports:
      - "8082:8082"
    networks:
      - nextlogic
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_job:5432/jobdb
      SPRING_DATASOURCE_USERNAME: job
      SPRING_DATASOURCE_PASSWORD: job123
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/jobservice
      SPRING_PROFILES_ACTIVE: docker

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      - postgres_user
      - kafka
      - eureka-server
    ports:
      - "8083:8083"
    networks:
      - nextlogic
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_user:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user123
      SPRING_PROFILES_ACTIVE: docker

  alert-service:
    build:
      context: .
      dockerfile: alert-service/Dockerfile
    depends_on:
      - postgres_alert
      - kafka
      - eureka-server
    ports:
      - "8084:8084"
    networks:
      - nextlogic
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_alert:5432/alertdb
      SPRING_DATASOURCE_USERNAME: alert
      SPRING_DATASOURCE_PASSWORD: alert123
      SPRING_PROFILES_ACTIVE: docker

  scraper-service:
    build:
      context: .
      dockerfile: scraper-service/Dockerfile
    depends_on:
      - postgres_scraper
      - kafka
      - eureka-server
    ports:
      - "8085:8085"
    networks:
      - nextlogic
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_scraper:5432/scraperdb
      SPRING_DATASOURCE_USERNAME: scraper
      SPRING_DATASOURCE_PASSWORD: scraper123
      SPRING_PROFILES_ACTIVE: docker

networks:
  nextlogic:
